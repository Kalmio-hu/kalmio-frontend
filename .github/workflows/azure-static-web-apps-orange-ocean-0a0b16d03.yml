name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Drift check: if KALMIO_API_URL is set (e.g. a backend sidecar is running in CI),
      # regenerate src/types/api.d.ts and fail if it differs from the committed version.
      # If KALMIO_API_URL is not set we skip — the predev/prebuild hook on every dev's
      # machine is the primary guard. This step exists so a CI environment with a
      # live backend can catch drift before it reaches production.
      - name: Check API types are up to date
        if: ${{ env.KALMIO_API_URL != '' }}
        run: |
          pnpm gen:api
          git diff --exit-code src/types/api.d.ts || (echo "ERROR: Run npm run gen:api locally and commit the updated src/types/api.d.ts — backend OpenAPI routes have drifted." && exit 1)
        working-directory: kalmio-frontend

      # Static gates: lint + unit tests must pass before we burn a build slot.
      # `pnpm build` already runs `tsc -b`, so type-checking is covered there.
      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_URL: https://api.kalmio.hu
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: https://eu.i.posthog.com

      # Headless smoke: boots `vite preview` against the built bundle and verifies
      # React mounts without uncaught errors. Catches the white-screen-on-boot
      # failure class that static checks can't.
      - name: Install Playwright browser
        run: pnpm exec playwright install chromium --with-deps

      - name: Smoke test built bundle
        run: pnpm smoke

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_OCEAN_0A0B16D03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          output_location: ""

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_OCEAN_0A0B16D03 }}
          action: close
